[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-evaluation-workbench"
version = "1.0.0"
description = "Reproducible XGBoost and Random Forest evaluation with held-out tests, cross-validation, residuals, and SHAP."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "CJ Fleming" }]
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=1.26,<2.5",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "shap>=0.46,<1",
  "xgboost>=2.1,<4",
]

[project.scripts]
model-eval = "model_evaluation_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
